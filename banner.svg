<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Arjun Rose J S - Robotics and Automation Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131c"/>
      <stop offset="0.55" stop-color="#12474d"/>
      <stop offset="1" stop-color="#2196F3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#2fd3c0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2fd3c0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.6" fill="#7fe3ff" fill-opacity="0.22"/>
    </pattern>
    <style>
      .trace { fill: none; stroke: #5ee6d0; stroke-width: 2.5; stroke-opacity: 0.55; stroke-dasharray: 8 14; animation: flow 3s linear infinite; }
      .node { fill: none; stroke: #5ee6d0; stroke-width: 2.5; stroke-opacity: 0.65; }
      @keyframes flow { to { stroke-dashoffset: -88; } }
      .pulse { animation: pulse 1.8s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      .name { font: 800 60px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 6px; fill: #ffffff; }
      .role { font: 600 20px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 7px; fill: #2fd3c0; }
      .sub { font: 500 15px 'Courier New', Courier, monospace; letter-spacing: 2px; fill: #cfe9ee; fill-opacity: 0.9; }
    </style>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="260" rx="18" fill="url(#glow)"/>

  <!-- circuit traces -->
  <path class="trace" d="M0 70 H120 L170 120 V200"/>
  <circle class="node" cx="170" cy="208" r="8"/>
  <path class="trace" d="M0 196 H90 L130 156"/>
  <circle class="node" cx="136" cy="150" r="8"/>
  <path class="trace" d="M1200 84 H1080 L1030 134 V212"/>
  <circle class="node" cx="1030" cy="220" r="8"/>
  <path class="trace" d="M1200 204 H1110 L1070 164"/>
  <circle class="node" cx="1064" cy="158" r="8"/>

  <!-- status -->
  <circle class="pulse" cx="1022" cy="38" r="6" fill="#2fd3c0"/>
  <text class="sub" x="1168" y="43" text-anchor="end">OPEN TO WORK</text>

  <!-- title -->
  <text class="name" x="600" y="128" text-anchor="middle">ARJUN ROSE J S</text>
  <text class="role" x="600" y="168" text-anchor="middle">ROBOTICS &amp; AUTOMATION ENGINEER</text>
  <text class="sub" x="600" y="212" text-anchor="middle">SIEMENS PLC  ·  INDUSTRIAL ROBOTS  ·  VISION AI  ·  IIoT</text>
</svg>
