<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 44" width="800" height="44" role="img" aria-label="Rotating list of core skills: Siemens PLC, industrial robots, vision AI, industrial IoT">
  <style>
    text { font: 600 21px 'Courier New', Courier, monospace; fill: #2FD3C0; text-anchor: middle; }
    .l { opacity: 0; animation: cyc 15s infinite; }
    @keyframes cyc {
      0%   { opacity: 0; transform: translateY(8px); }
      3%   { opacity: 1; transform: translateY(0); }
      17%  { opacity: 1; transform: translateY(0); }
      20%  { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; transform: translateY(-8px); }
    }
    .d2 { animation-delay: 3s; }
    .d3 { animation-delay: 6s; }
    .d4 { animation-delay: 9s; }
    .d5 { animation-delay: 12s; }
  </style>
  <text class="l d1" x="400" y="29">&gt; I make machines think and move</text>
  <text class="l d2" x="400" y="29">&gt; Siemens PLC  ·  TIA Portal  ·  Festo MPS</text>
  <text class="l d3" x="400" y="29">&gt; Yaskawa  ·  Igus Delta  ·  Dobot  ·  Cobots</text>
  <text class="l d4" x="400" y="29">&gt; Vision AI with OpenCV and YOLOv8</text>
  <text class="l d5" x="400" y="29">&gt; Industrial IoT  ·  CAN  ·  ESP32  ·  Jetson Nano</text>
</svg>
